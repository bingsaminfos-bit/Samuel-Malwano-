name: Publish Android Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Pre-compiled APK
        run: |
          set -e
          echo "== Validating Pre-compiled APK =="
          
          if [ ! -f "apk-distribution/app-debug.apk" ]; then
            echo "::error::apk-distribution/app-debug.apk does not exist!"
            exit 1
          fi

          if [ ! -s "apk-distribution/app-debug.apk" ]; then
            echo "::error::apk-distribution/app-debug.apk is empty!"
            exit 1
          fi

          if [ ! -f "apk-distribution/app-debug.apk.sha256" ]; then
            echo "::error::apk-distribution/app-debug.apk.sha256 checksum file does not exist!"
            exit 1
          fi

          echo "Verifying SHA-256 checksum..."
          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)

          echo "Verifying ZIP archive integrity..."
          unzip -tq apk-distribution/app-debug.apk

          echo "APK validation successful."

      - name: Publish GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Android Debug APK (Build ${{ github.run_number }})"
          
          APK_PATH="apk-distribution/app-debug.apk"
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          APK_BYTES=$(stat -c "%s" "$APK_PATH")
          APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          
          cat << EOF > release_notes.md
### 📱 Android Debug APK Release
- **File:** \`app-debug.apk\`
- **Tag:** \`$TAG_NAME\`
- **Size:** $APK_SIZE ($APK_BYTES bytes)
- **SHA-256:** \`$APK_SHA\`

Direct download link:
https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk
EOF

          echo "Creating Release $TAG_NAME..."
          gh release create "$TAG_NAME" "$APK_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest

      - name: Generate Job Summary
        if: success()
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          APK_PATH="apk-distribution/app-debug.apk"
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          APK_BYTES=$(stat -c "%s" "$APK_PATH")
          APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          echo "## 🚀 APK Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Tag** | \`$TAG_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK File** | \`app-debug.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK Size** | $APK_SIZE ($APK_BYTES bytes) |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA-256** | \`$APK_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Page** | [$RELEASE_URL]($RELEASE_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Direct APK Download URL** | [$DOWNLOAD_URL]($DOWNLOAD_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Direct APK Download Link:" >> $GITHUB_STEP_SUMMARY
          echo "\`$DOWNLOAD_URL\`" >> $GITHUB_STEP_SUMMARY
